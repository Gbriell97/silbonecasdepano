<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administração do Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

<!-- Tela de login -->
<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm">
    <h1>Área administrativa</h1>
    <p>Digite a senha para editar o cardápio</p>
    <input type="password" id="senhaInput" placeholder="Senha" required />
    <button type="submit">Entrar</button>
    <p class="login-erro" id="loginErro"></p>
  </form>
</div>

<!-- Painel admin -->
<div class="admin-panel" id="adminPanel" hidden>
  <header class="admin-header">
    <h1>Editar cardápio</h1>
    <div class="admin-header-actions">
      <a href="/" class="btn-link" target="_blank">Ver site</a>
      <button id="btnLogout" class="btn-link">Sair</button>
    </div>
  </header>

  <div class="admin-content" id="adminContent">
    <p class="loading">Carregando...</p>
  </div>

  <button id="btnNovaCategoria" class="btn-nova-categoria">+ Nova categoria</button>

  <section class="loja-section">
    <h2>Aparência da loja</h2>

    <div class="loja-field-group">
      <label>Logomarca</label>
      <div class="upload-row">
        <img id="previewLogo" class="preview-circular" hidden />
        <div id="previewLogoFallback" class="preview-circular preview-placeholder">🍴</div>
        <input type="file" id="inputLogo" accept="image/*" />
      </div>
    </div>

    <div class="loja-field-group">
      <label>Fotos de capa (até 3)</label>
      <p class="hint-reenquadrar">💡 Clique na foto para escolher o ponto de foco</p>
      <div class="capas-grid">
        <div class="capa-slot">
          <img id="previewCapa1" class="preview-capa" hidden />
          <input type="file" id="inputCapa1" accept="image/*" />
        </div>
        <div class="capa-slot">
          <img id="previewCapa2" class="preview-capa" hidden />
          <input type="file" id="inputCapa2" accept="image/*" />
        </div>
        <div class="capa-slot">
          <img id="previewCapa3" class="preview-capa" hidden />
          <input type="file" id="inputCapa3" accept="image/*" />
        </div>
      </div>
    </div>

    <form id="formLoja" class="loja-form">
      <label>Nome da loja
        <input type="text" id="lojaNome" required />
      </label>
      <label>Frase de efeito (subtítulo)
        <input type="text" id="lojaTagline" placeholder="Ex: Comida boa, feita com carinho" />
      </label>
      <label>Endereço
        <input type="text" id="lojaEndereco" placeholder="Rua, número, bairro, cidade" />
      </label>
      <label>Texto de entrega
        <input type="text" id="lojaEntrega" placeholder="Ex: Entrega em até 40 min" />
      </label>
      <label>Cor principal do site
        <input type="color" id="lojaCor" value="#2f6b3a" />
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="lojaSempreAberto" />
        Ignorar horário (loja sempre aparece como aberta)
      </label>

      <div id="horariosBlock" class="horarios-block">
        <label class="horarios-title">Horário de funcionamento</label>
        <div id="horariosLista"></div>
      </div>

      <button type="submit" class="btn-primario">Salvar aparência</button>
    </form>
  </section>

  <section class="pedidos-section">
    <h2>Últimos pedidos</h2>
    <div id="listaPedidos"><p class="loading">Carregando pedidos...</p></div>
  </section>
</div>

<!-- Modal de categoria (nome + ícone) -->
<div class="modal" id="modalCategoria" hidden>
  <div class="modal-backdrop" id="modalCategoriaBackdrop"></div>
  <form class="modal-box" id="formCategoria">
    <h2 id="modalCategoriaTitulo">Nova categoria</h2>

    <label>Nome
      <input type="text" id="categoriaNome" required />
    </label>

    <label>Ícone
      <input type="text" id="categoriaIcone" maxlength="4" placeholder="Ex: 🍔" />
    </label>

    <div class="emoji-sugestoes" id="emojiSugestoes"></div>

    <div class="modal-actions">
      <button type="button" id="btnCancelarCategoria" class="btn-secundario">Cancelar</button>
      <button type="submit" class="btn-primario">Salvar</button>
    </div>
  </form>
</div>

<!-- Modal editar/criar produto -->
<div class="modal" id="modalProduto" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <form class="modal-box" id="formProduto">
    <h2 id="modalTitulo">Editar item</h2>

    <label>Nome
      <input type="text" id="campoNome" required />
    </label>
    <label>Descrição
      <textarea id="campoDescricao" rows="2"></textarea>
    </label>
    <label>Preço (R$)
      <input type="number" id="campoPreco" step="0.01" min="0" required />
    </label>
    <label>Categoria
      <select id="campoCategoria" required></select>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="campoDisponivel" checked />
      Disponível no cardápio
    </label>

    <label>Foto
      <input type="file" id="campoFoto" accept="image/*" />
    </label>
    <img id="previewFoto" class="preview-foto" hidden />
    <p class="hint-reenquadrar" id="hintFoto" hidden>💡 Clique na foto para escolher o ponto de foco</p>

    <div class="modal-actions">
      <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
      <button type="submit" class="btn-primario">Salvar</button>
    </div>
  </form>
</div>

<script src="admin.js"></script>
</body>
</html>
