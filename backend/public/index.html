<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#2f6b3a" id="themeColorMeta" />
<title>Cardápio Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Capa com fotos -->
<div class="cover" id="cover"></div>

<!-- Cartão de identidade da loja -->
<div class="store-card">
  <img class="store-logo" id="storeLogo" src="" alt="" hidden />
  <div class="store-logo-fallback" id="storeLogoFallback">🍴</div>
  <div class="store-info">
    <h1 id="storeName">Carregando...</h1>
    <p id="storeTagline"></p>
  </div>
  <div class="store-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">—</span>
    <span class="store-delivery" id="storeDelivery"></span>
  </div>
</div>

<!-- Ações rápidas -->
<div class="quick-actions">
  <button class="quick-btn" id="btnRepetir">
    <span class="quick-icon">🔁</span> Peça de novo
  </button>
  <button class="quick-btn" id="btnWhats">
    <span class="quick-icon">💬</span> Fale conosco
  </button>
  <button class="quick-btn cart" id="cartToggle">
    <span class="quick-icon">🧾</span> Carrinho
    <span class="cart-count" id="cartCount" hidden>0</span>
  </button>
</div>

<!-- Busca -->
<div class="search-bar">
  <span class="search-icon">🔎</span>
  <input type="text" id="searchInput" placeholder="Pesquisar produto..." />
</div>

<!-- Categorias com ícones -->
<nav class="cat-grid" id="catNav"></nav>

<main class="menu" id="menu">
  <p class="loading">Carregando cardápio…</p>
</main>

<!-- Comanda / Carrinho -->
<aside class="ticket" id="ticket" aria-hidden="true">
  <div class="ticket-backdrop" id="ticketBackdrop"></div>
  <div class="ticket-panel">
    <div class="ticket-head">
      <span>COMANDA</span>
      <button id="closeTicket" class="ticket-close" aria-label="Fechar">✕</button>
    </div>

    <div class="ticket-items" id="ticketItems">
      <p class="ticket-empty">Sua comanda está vazia.<br>Adicione itens do cardápio.</p>
    </div>

    <div class="ticket-total-row">
      <span>TOTAL</span>
      <span id="ticketTotal">R$ 0,00</span>
    </div>

    <form id="checkoutForm" class="checkout-form">
      <label>
        Nome
        <input type="text" id="clienteNome" required placeholder="Seu nome" />
      </label>
      <label>
        WhatsApp
        <input type="tel" id="clienteTelefone" required placeholder="(11) 99999-9999" />
      </label>
      <label>
        Endereço para entrega (opcional)
        <input type="text" id="clienteEndereco" placeholder="Rua, número, bairro" />
      </label>
      <label>
        Forma de pagamento
        <select id="formaPagamento">
          <option value="Dinheiro">Dinheiro na entrega</option>
          <option value="Cartão na entrega">Cartão na entrega</option>
          <option value="Pix">Pix</option>
          <option value="Pagamento online">Pagamento online</option>
        </select>
      </label>

      <button type="submit" class="btn-confirm" id="btnConfirm">Enviar pedido pelo WhatsApp</button>
    </form>

    <p class="ticket-footnote">Ao confirmar, seu pedido será enviado direto no WhatsApp da loja.</p>
  </div>
</aside>

<!-- Modal de informações -->
<div class="modal" id="modalInfo" hidden>
  <div class="modal-backdrop" id="infoBackdrop"></div>
  <div class="modal-box">
    <h2>Informações</h2>
    <p id="infoTagline"></p>
    <p id="infoEndereco"></p>
    <p id="infoEntrega"></p>
    <h3>Horário de funcionamento</h3>
    <div id="infoHorarios"></div>
    <button class="btn-confirm" id="btnFecharInfo">Fechar</button>
  </div>
</div>

<!-- Zoom da foto do produto -->
<div class="modal photo-modal" id="modalFoto" hidden>
  <div class="modal-backdrop" id="fotoBackdrop"></div>
  <div class="photo-modal-box">
    <button class="photo-modal-close" id="fecharFoto">✕</button>
    <img id="fotoAmpliada" src="" alt="" />
    <div class="foto-nav" id="fotoNav" hidden>
      <button type="button" id="fotoAnterior" class="foto-nav-btn">‹</button>
      <button type="button" id="fotoProxima" class="foto-nav-btn">›</button>
    </div>
    <span class="foto-contador" id="fotoContador"></span>
  </div>
</div>

<!-- Barra de navegação inferior -->
<nav class="bottom-nav">
  <button class="bottom-item active" data-nav="catalogo">
    <span>📖</span> Catálogo
  </button>
  <button class="bottom-item" data-nav="carrinho">
    <span>🧾</span> Carrinho
  </button>
  <button class="bottom-item" data-nav="info">
    <span>ℹ️</span> Info
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
